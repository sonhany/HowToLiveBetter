name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Deploy static site to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_5QJUE5wJANFFvdvtx8pPFor8
          VERCEL_PROJECT_ID: prj_cZ4u70MUXkinpZ7IZ4nuokW4SJ1u
        run: |
          npx --yes vercel@latest deploy . --prod --yes --token "$VERCEL_TOKEN"
